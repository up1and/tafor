[project]
name = "tafor"
version = "3.0.dev"
description = "A Terminal Aerodrome Forecast Encoding Software"
authors = [
    {name = "up1and", email = "piratecb@gmail.com"},
]
dependencies = [
    "falcon",
    "pyserial",
    "python-dateutil",
    "pyjwt",
    "pyjwt[crypto]",
    "pyshp",
    "pyproj",
    "waitress",
    "requests",
    "SQLAlchemy",
    "Shapely==1.8.5.post1",
    "PyQt5==5.15.11",
    "PyQtChart==5.15.7",
]

requires-python = ">=3.10, <3.12"

readme = "README.md"

license = {text = "GPL-2.0"}

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-cov",
    "pytest-env",
]

[tool.uv]
constraint-dependencies = [
    "greenlet<3.2",
    "PyQt5-Qt5==5.15.2",
    "PyQtChart-Qt5==5.15.2",
]

[tool.ruff.format]
quote-style = "single"
